name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"

jobs:
  test:
    name: mix test and format
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  integration:
    name: browser tests (mix test.integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      CLAWSWAP_HEADLESS: "1"
      ZELLIJ_VERSION: "0.45.1"
      INOTIFY_TOOLS_VERSION: "4.23.9.0"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-integration-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-integration-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # The tests run `clawswap up` in tmux and zellij (and npm ci for examples/react-embed); the watcher
      # needs inotify-tools to notice file changes. The runner image has tmux. zellij and inotify-tools
      # are cached, so a run doesn't wait on (or fail with) GitHub's or Ubuntu's mirrors; only a
      # cache miss fetches them (from GitHub), with timeouts and retries.
      - uses: actions/cache@v4
        id: tools
        with:
          path: ~/ci-tools
          key: ci-tools-${{ runner.os }}-ubuntu-24.04-zellij-${{ env.ZELLIJ_VERSION }}-inotify-tools-${{ env.INOTIFY_TOOLS_VERSION }}

      - name: Download zellij, build inotify-tools
        if: steps.tools.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/ci-tools/src && cd ~/ci-tools
          fetch() { curl -fsSL --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors "$@"; }
          fetch "https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz" | tar -xz zellij
          # From its source on GitHub rather than Ubuntu's mirrors, which the runners sometimes can't even resolve.
          fetch "https://github.com/inotify-tools/inotify-tools/archive/refs/tags/${INOTIFY_TOOLS_VERSION}.tar.gz" \
            | tar -xz -C src --strip-components=1
          cd src
          ./autogen.sh
          ./configure --prefix="$HOME/ci-tools/inotify" --disable-shared CFLAGS="-O2 -Wno-error"
          make -j"$(nproc)"
          make install
          cd .. && rm -rf src

      - name: Install tmux, zellij and inotify-tools
        run: |
          sudo install -m 755 ~/ci-tools/zellij /usr/local/bin/zellij
          sudo install -m 755 ~/ci-tools/inotify/bin/* /usr/local/bin/
          command -v tmux || { sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y -o Acquire::Retries=5 tmux; }
          tmux -V
          zellij --version
          command -v inotifywait

      # npm ci for the example app, from npm's cache when its lock hasn't changed.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('examples/react-embed/package-lock.json') }}

      # The runner image ships Google Chrome with the chromedriver built for it (same major version, which
      # is all Clawswap.Walkthrough.Driver asks for). Ubuntu 24.04's AppArmor can stop Chrome's sandbox
      # starting; let it.
      - name: Chrome and chromedriver
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CLAWSWAP_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CLAWSWAP_CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "$GITHUB_ENV"
          google-chrome --version
          "${CHROMEWEBDRIVER}/chromedriver" --version

      - run: mix deps.get
      # Every test brings clawswap up, so once one can't, the rest won't either.
      - run: mix test.integration --max-failures 1
